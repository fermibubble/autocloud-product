kind: Capability
name: observability
version: 1.0.1  # 1.0.0 shipped requiredTools [query_metrics] (plural drift); registry versions are immutable
description: Read-side telemetry — metrics, logs, service inventory.
ceiling:
  scopes: [metrics:read, logs:read, inventory:read]
  allowDestructive: false
  allowOpenWorld: false
  minTrust: claimed
  defaults: { read: allow }
required:
  scopes: [metrics:read, logs:read]
  tools: [query_metric, search_logs]
