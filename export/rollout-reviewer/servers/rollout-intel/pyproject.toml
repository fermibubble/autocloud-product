[project]
name = "rollout-intel"
version = "0.1.0"
description = "Rollout Intelligence Layer: episodes, signed evidence, deterministic policy, dossier journal, precedent retrieval"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "pyyaml>=6.0", "httpx>=0.27", "sqlalchemy>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
