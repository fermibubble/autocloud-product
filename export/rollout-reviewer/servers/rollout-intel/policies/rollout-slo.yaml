# Versioned policy pack: the deterministic layer of the rollout verdict.
# Rules are evaluated by rollout-intel over VERIFIED observation envelopes
# only; the LLM interprets, this decides. Editing thresholds = new version.
name: rollout-slo
version: 1

# The policy owns the checkpoint schedule (dynamic scheduling): the
# ladder and its offsets, the bounds any agent proposal is clamped to,
# and the exit criteria that may close the ladder early. Different
# applications ship different policies with different ladders — stage
# names are whatever this block declares, nowhere else.
checkpoints:
  ladder:
    - {stage: "T+0", offset_minutes: 0}
    - {stage: "T+5", offset_minutes: 5}
    - {stage: "T+15", offset_minutes: 15}
    - {stage: "T+30", offset_minutes: 30}
  bounds:
    min_interval_minutes: 2    # proposals may tighten down to this
    max_interval_minutes: 60   # proposals are clamped to this when loosening
  exit:
    consecutive_healthy: 2     # healthy checkpoints in a row to close early…
    min_soak_minutes: 30       # …but never before this much soak

# Ground-truth grading horizons for the outcome collector. Keep 24h in
# every policy: it is the fleet-standard horizon that keeps
# falseSafe/falseHalt comparable across services.
outcome_horizons: ["30m", "2h", "24h"]
rules:
  - id: revision-serving
    type: workload_serving
    description: The service must be serving traffic on the new revision.
    stages: ["T+0"]

  - id: min-samples
    type: min_samples
    description: >
      Canary traffic must reach the minimum sample count before metric
      verdicts count as evidence; below it the honest outcome is
      insufficient_evidence, never healthy.
    metric_contains: request_count
    min_count: 5000
    stages: ["T+5", "T+15", "T+30"]

  - id: p99-envelope
    type: p99_max
    description: P99 latency must stay at or below 250ms.
    metric_contains: latenc
    max_ms: 250
    stages: ["T+5", "T+15", "T+30"]

  - id: error-rate
    type: error_rate_max
    description: 5xx error rate must stay at or below 0.5%.
    metric_contains: 5xx
    max_rate: 0.005
    stages: ["T+5", "T+15", "T+30"]

  - id: no-new-fatal
    type: no_new_fatal
    description: No NEW fatal/critical stack patterns absent from baseline.
    pattern: "FATAL"
    stages: ["T+15", "T+30"]
